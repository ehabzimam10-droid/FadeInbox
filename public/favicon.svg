<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29" />
      <stop offset="50%" stop-color="#1e1346" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" stroke="url(#shieldGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Glowing Outer Shield -->
  <path d="M256 72 L392 128 C392 272 256 384 256 424 C256 384 120 272 120 128 Z" 
        fill="#1e1642" 
        stroke="url(#shieldGrad)" 
        stroke-width="16" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Inner Envelope -->
  <g transform="translate(160, 180)">
    <rect x="0" y="0" width="192" height="132" rx="18" fill="#130d2d" stroke="url(#glowGrad)" stroke-width="12" />
    <!-- Envelope Flap -->
    <path d="M6 10 L96 82 L186 10" fill="none" stroke="url(#glowGrad)" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" />
    <!-- Envelope Inner Fold lines -->
    <path d="M6 122 L72 68" stroke="url(#shieldGrad)" stroke-width="8" stroke-linecap="round" stroke-opacity="0.7" />
    <path d="M186 122 L120 68" stroke="url(#shieldGrad)" stroke-width="8" stroke-linecap="round" stroke-opacity="0.7" />
  </g>

  <!-- Particle Sparks / Fading Dots -->
  <circle cx="396" cy="180" r="10" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="430" cy="220" r="7" fill="#c084fc" filter="url(#glow)" />
  <circle cx="410" cy="264" r="5" fill="#818cf8" filter="url(#glow)" />
  <circle cx="438" cy="300" r="8" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="380" cy="324" r="6" fill="#ec4899" filter="url(#glow)" />
</svg>
